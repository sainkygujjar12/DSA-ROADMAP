# Import this repository as a Render Blueprint. Secrets are entered in Render.
services:
  - type: web
    name: dsa-roadmap
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: MONGO_URI
        sync: false
      - key: MONGO_MAX_POOL_SIZE
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: EMAIL_PROVIDER
        value: smtp2go
      - key: SMTP2GO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
